[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-middleware"
version = "0.1.0"
description = "LLM Guardrail Middleware foundation and rule engine"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "openai>=1.0,<3", "keyring>=25,<26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["guardrail_middleware*"]
